services:
  db:
    image: mysql:8.4
    restart: always
    env_file:
      - apps/api/.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: installer
    working_dir: /app/apps/api
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm db:seed"]
    env_file:
      - apps/api/.env
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    profiles: [migrate]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3000:4000"
    env_file:
      - apps/api/.env
    environment:
      MYSQL_HOST: db
      PORT: "4000"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "5173:3000"
    env_file:
      - apps/web/.env
    environment:
      API_ORIGIN: http://api:4000
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:1.26-alpine
    restart: always
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
